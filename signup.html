<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wonder Box Outreach</title>
<style>
  :root { --bg:#f6f7f4; --card:#fff; --fg:#1d2420; --muted:#5f6b64; --red:#b3261e; --green:#1f6b45; --line:#d9ded8; --girls:#c2185b; --boys:#1565c0; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--fg); -webkit-tap-highlight-color: transparent; }
  header { background:var(--green); color:#fff; padding:14px max(16px, env(safe-area-inset-right)) 14px max(16px, env(safe-area-inset-left)); padding-top: max(14px, env(safe-area-inset-top)); display:flex; justify-content:space-between; align-items:center; gap:12px; }
  header h1 { font-size:18px; margin:0; }
  .hright { text-align:right; line-height:1.3; font-size:13px; font-variant-numeric: tabular-nums; white-space:nowrap; }
  main { padding:16px max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left)); display:flex; flex-direction:column; gap:14px; max-width:560px; margin:0 auto; }
  .btn { display:block; width:100%; padding:14px; font-size:16px; border-radius:10px; border:0; background:var(--red); color:#fff; font-weight:600; text-align:center; cursor:pointer; }
  .btn:disabled { opacity:.6; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; display:flex; flex-direction:column; gap:10px; }
  label, .lbl { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  input { width:100%; padding:10px; font-size:16px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); }
  #status { font-size:14px; color:var(--muted); text-align:center; }
  #status:empty { display:none; }
  #status.err { color:var(--red); }
  #off { background:#fbeceb; border-color:var(--red); color:var(--red); text-align:center; font-weight:600; }
  #off small { display:block; font-weight:400; color:var(--muted); margin-top:4px; }
  /* Girls down the left, Boys down the right. */
  #cats { display:grid; grid-template-columns:1fr 1fr; grid-template-rows:repeat(6, auto); grid-auto-flow:column; gap:10px; }
  #cats button { min-height:76px; border:0; border-radius:12px; color:#fff; font-size:20px; font-weight:700; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; cursor:pointer; touch-action:manipulation; }
  #cats button .n { font-size:15px; font-weight:600; opacity:.95; font-variant-numeric: tabular-nums; }
  #cats button.girls { background:var(--girls); }
  #cats button.boys { background:var(--boys); }
  #cats button:active { transform:scale(.97); }
  #cats button.flash { animation: flash 1.6s ease-out; }
  @keyframes flash { 0%, 55% { box-shadow: 0 0 0 6px #f2c94c; } 100% { box-shadow: 0 0 0 0 transparent; } }
  #cats.disabled button { background:#9aa39e; cursor:not-allowed; }
  #recent { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  #recent li { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:15px; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-variant-numeric: tabular-nums; }
  #recent li.girls { border-left:5px solid var(--girls); }
  #recent li.boys { border-left:5px solid var(--boys); }
  #recent li.undoable { cursor:pointer; }
  #recent .when { color:var(--muted); font-size:13px; margin-left:6px; }
  #recent .st { font-size:13px; color:var(--muted); }
  #recent .st.tap { color:var(--fg); text-decoration:underline; }
  #recent .st.bad { color:var(--red); }
  #recent li.done { opacity:.55; }
  #recent button { font-size:13px; padding:4px 10px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
  .link { background:none; border:0; color:var(--muted); font-size:13px; text-decoration:underline; padding:0; align-self:center; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>Wonder Box Outreach</h1>
  <div class="hright"><div id="today"></div><div id="total"></div></div>
</header>

<main>
  <!-- One-time setup on each phone (same passcode as the toy scanner) -->
  <div class="card" id="setup" hidden>
    <div class="lbl">Set up this phone</div>
    <div><label for="setPass">Passcode</label><input id="setPass" autocomplete="off" placeholder="Ask the toy drive leader"></div>
    <button class="btn" id="setSave">Continue</button>
    <div id="setMsg" class="st"></div>
  </div>

  <div id="app" hidden style="display:flex;flex-direction:column;gap:14px">
    <div class="card" id="off" hidden>Sign-ups are turned off right now.<small>A leader can turn them back on in the Sheet (App Settings tab).</small></div>
    <div id="cats"></div>
    <div id="status"></div>
    <ul id="recent"></ul>
    <button class="link" id="changeSetup">Change passcode</button>
  </div>
</main>

<script>
  /* ====== Same Apps Script web app URL as index.html ====== */
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyRL1KZmp1m3G1k4KW46NkgeCnMRR6iosK-SmNu0Dv3GWi-fAs9FcpOUVwpZcxV0uAH/exec';
  /* ======================================================== */

  // Must match SIGNUP_CATEGORIES in the toy drive app.
  const CATEGORIES = [
    'Girls 0-2', 'Girls 3-5', 'Girls 6-8', 'Girls 9-11', 'Girls 12-14', 'Girls 15-18',
    'Boys 0-2', 'Boys 3-5', 'Boys 6-8', 'Boys 9-11', 'Boys 12-14', 'Boys 15-18'
  ];

  const $ = id => document.getElementById(id);
  const status = (t, err) => { $('status').textContent = t || ''; $('status').classList.toggle('err', !!err); };
  const side = c => c.indexOf('Girls') === 0 ? 'girls' : 'boys';

  const store = {
    get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  let pass = store.get('tds_pass');

  async function api(body) {
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids a CORS preflight Apps Script can't answer
      body: JSON.stringify(Object.assign({ passcode: pass }, body))
    });
    return res.json();
  }

  /* ---------- One-time setup ---------- */
  function showSetup() { $('setPass').value = pass; $('setup').hidden = false; $('app').hidden = true; }
  function showApp() { $('setup').hidden = true; $('app').hidden = false; refresh(); }

  $('setSave').onclick = async () => {
    const p = $('setPass').value.trim();
    if (!p) { $('setMsg').textContent = 'Enter the passcode.'; return; }
    $('setSave').disabled = true;
    $('setMsg').textContent = 'Checking…';
    pass = p;
    try {
      const r = await api({ action: 'signups' });
      if (r.ok) { store.set('tds_pass', p); applyState(r); showApp(); }
      else $('setMsg').textContent = r.error === 'wrong_passcode' ? 'That passcode isn\'t right. Check with the toy drive leader.' : 'The Sheet answered with an error: ' + r.error;
    } catch (e) {
      $('setMsg').textContent = 'Couldn\'t reach the Sheet. Check your internet connection and try again.';
    }
    $('setSave').disabled = false;
  };
  $('changeSetup').onclick = () => showSetup();

  /* ---------- Counts: what the Sheet last said, plus taps still on their way ---------- */
  let sheetCounts = null, today = null, total = null, active = true;
  const pending = {}; // category -> taps sent but not answered yet
  const buttons = {};
  CATEGORIES.forEach(c => {
    pending[c] = 0;
    const b = document.createElement('button');
    b.className = side(c);
    b.innerHTML = '<span class="c"></span><span class="n"></span>';
    b.querySelector('.c').textContent = c;
    b.onclick = () => tap(c);
    buttons[c] = b;
    $('cats').append(b);
  });

  function render() {
    let waiting = 0;
    CATEGORIES.forEach(c => {
      waiting += pending[c];
      buttons[c].querySelector('.n').textContent = sheetCounts ? (sheetCounts[c] + pending[c]) + ' signed up' : '…';
    });
    $('today').textContent = today === null ? '' : 'Today: ' + (today + waiting);
    $('total').textContent = total === null ? '' : 'Total: ' + (total + waiting);
    $('off').hidden = active;
    $('cats').classList.toggle('disabled', !active);
  }
  function applyState(r) {
    if (r.counts) sheetCounts = r.counts;
    if (typeof r.today === 'number') today = r.today;
    if (typeof r.total === 'number') total = r.total;
    if (typeof r.active === 'boolean') active = r.active;
    if (active && /turned off/.test($('status').textContent)) status('');
    render();
  }
  render();

  // Keep counts (and the on/off switch) current when other phones are adding too.
  async function refresh() {
    try {
      const r = await api({ action: 'signups' });
      if (r.ok) applyState(r);
      else if (r.error === 'wrong_passcode') status('The passcode was changed. Tap "Change passcode".', true);
    } catch (e) { /* try again next time */ }
  }
  setInterval(() => { if (!$('app').hidden && !document.hidden) refresh(); }, 20000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('app').hidden) refresh(); });

  /* ---------- Beep + buzz ---------- */
  let audio = null;
  function beep(ok) {
    if (navigator.vibrate) navigator.vibrate(ok ? 50 : [60, 60, 60]);
    try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) { return; }
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = ok ? 1100 : 300;
    g.gain.setValueAtTime(0.15, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.15);
    o.connect(g); g.connect(audio.destination);
    o.start(); o.stop(audio.currentTime + 0.16);
  }

  /* ---------- Tap = +1 right away, then saved to the Sheet ---------- */
  const lastTap = {};
  function tap(cat) {
    if (!active) { beep(false); return; } // the red banner already says why
    const now = Date.now();
    if (now - (lastTap[cat] || 0) < 700) return; // an accidental double tap counts once
    lastTap[cat] = now;
    beep(true);
    const b = buttons[cat];
    b.classList.remove('flash'); void b.offsetWidth; b.classList.add('flash');
    status('');
    send(cat, addRecent(cat));
  }

  async function send(cat, li) {
    pending[cat]++; render();
    setRecent(li, 'Saving…');
    let r = null;
    try { r = await api({ action: 'signup', category: cat }); } catch (e) { r = null; }
    pending[cat]--;
    if (r) applyState(r);
    if (r && r.ok) {
      li.dataset.id = r.id;
      setRecent(li, 'Tap to undo', 'tap');
      li.classList.add('undoable');
      return;
    }
    render();
    beep(false);
    if (!r) setRecent(li, 'Not saved (no connection)', 'bad', () => send(cat, li));
    else if (r.error === 'turned_off') { setRecent(li, 'Not saved: sign-ups are off', 'bad'); }
    else if (r.error === 'wrong_passcode') { setRecent(li, 'Not saved', 'bad', () => send(cat, li)); status('The passcode was changed. Tap "Change passcode".', true); }
    else setRecent(li, 'Not saved', 'bad', () => send(cat, li));
  }

  /* ---------- Tap a recent sign-up to undo it ---------- */
  async function undo(li) {
    const cat = li.dataset.cat, id = li.dataset.id;
    if (!id || li.classList.contains('busy')) return;
    if (!active) { status('Sign-ups are turned off, so undo is off too.', true); return; }
    if (!confirm('Undo this sign-up?\n\n' + cat + ' at ' + li.querySelector('.when').textContent)) return;
    li.classList.add('busy');
    setRecent(li, 'Undoing…');
    try {
      const r = await api({ action: 'signupUndo', category: cat, id: id });
      applyState(r);
      if (r.ok) {
        li.classList.remove('undoable'); li.classList.add('done'); delete li.dataset.id;
        setRecent(li, r.removed ? 'Undone' : 'Already undone');
      } else {
        setRecent(li, 'Tap to undo', 'tap');
        status(r.error === 'turned_off' ? 'Sign-ups are turned off, so undo is off too.' : 'Couldn\'t undo: ' + r.error, true);
      }
    } catch (e) {
      setRecent(li, 'Tap to undo', 'tap');
      status('Couldn\'t undo: no connection. Try again.', true);
    }
    li.classList.remove('busy');
  }

  /* ---------- Recent sign-ups list (last 10 on this phone) ---------- */
  function addRecent(cat) {
    const li = document.createElement('li');
    li.className = side(cat);
    li.dataset.cat = cat;
    li.innerHTML = '<span><span class="code"></span><span class="when"></span></span><span class="right"></span>';
    li.querySelector('.code').textContent = cat;
    li.querySelector('.when').textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    li.onclick = e => { if (e.target.tagName !== 'BUTTON') undo(li); };
    $('recent').prepend(li);
    while ($('recent').children.length > 10) $('recent').lastChild.remove();
    return li;
  }
  function setRecent(li, text, cls, retry) {
    const right = li.querySelector('.right');
    right.innerHTML = '<span class="st"></span>';
    const st = right.querySelector('.st');
    st.textContent = text; if (cls) st.classList.add(cls);
    if (retry) {
      const b = document.createElement('button');
      b.textContent = 'Retry';
      b.onclick = retry;
      right.append(' ', b);
    }
  }

  /* ---------- Start ---------- */
  if (pass) showApp(); else showSetup();
</script>
</body>
</html>
