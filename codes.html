<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign-up QR Codes</title>
<script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  :root { --fg:#1d2420; --muted:#5f6b64; --green:#1f6b45; --line:#d9ded8; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:#fff; color:var(--fg); }
  .bar { max-width:8in; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .bar h1 { margin:0; font-size:20px; }
  .bar p { margin:0; color:var(--muted); font-size:14px; line-height:1.4; }
  .bar button { align-self:flex-start; padding:12px 20px; font-size:16px; border:0; border-radius:10px; background:var(--green); color:#fff; font-weight:600; cursor:pointer; }
  .sheet { max-width:8in; margin:0 auto; padding:0 16px 24px; display:grid; grid-template-columns:repeat(3, 1fr); gap:0; }
  .code { border:1px dashed var(--line); padding:10px 8px 12px; text-align:center; break-inside:avoid; }
  .code svg { width:100%; max-width:2in; height:auto; display:block; margin:0 auto; }
  .code .name { font-size:22px; font-weight:700; margin-top:4px; }
  .code .hint { font-size:11px; color:var(--muted); }
  @media (max-width:480px) { .sheet { grid-template-columns:repeat(2, 1fr); } }
  @page { size: letter; margin: 0.4in; }
  @media print {
    .bar { display:none; }
    .sheet { max-width:none; padding:0; grid-template-columns:repeat(3, 1fr); }
    .code { height:2.55in; padding:6px; }
    .code svg { max-width:1.85in; }
  }
</style>
</head>
<body>
<div class="bar">
  <h1>Sign-up QR codes</h1>
  <p>Print this page and put each code on its matching box, or keep the sheet at the sign-up table. Scanning a code with the sign-up scanner adds 1 to that category in the Sheet's "Sign-ups" tab.</p>
  <button onclick="window.print()">Print</button>
</div>
<div class="sheet" id="sheet"></div>

<script>
  // Must match SIGNUP_CATEGORIES in the toy drive app and the list in signup.html.
  const CATEGORIES = [
    'Girls 0-2', 'Girls 3-5', 'Girls 6-8', 'Girls 9-11', 'Girls 12-14', 'Girls 15-18',
    'Boys 0-2', 'Boys 3-5', 'Boys 6-8', 'Boys 9-11', 'Boys 12-14', 'Boys 15-18'
  ];
  const sheet = document.getElementById('sheet');
  CATEGORIES.forEach(cat => {
    const qr = qrcode(0, 'M');
    qr.addData('SIGNUP:' + cat);
    qr.make();
    const div = document.createElement('div');
    div.className = 'code';
    div.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true }) +
      '<div class="name"></div><div class="hint">Toy drive sign-up</div>';
    div.querySelector('.name').textContent = cat;
    sheet.append(div);
  });
</script>
</body>
</html>
